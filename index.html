<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1f3a26">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MeepleJacks">
<script>if ('serviceWorker' in navigator) window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () { }); });</script>
<title>MeepleJacks</title>
<style>
:root{
  --ink:#2e2018; --ink2:#6a4a32; --paper:#fbf3df; --paper2:#f4e4bc; --paper3:#ead6a6;
  --wood:#8a5a32; --wood2:#b07a42; --green:#5aa335; --green2:#3f7f25; --red:#d8463a; --gold:#f2c23a;
  --shadow:rgba(20,14,8,.4);
  --font:"Nunito","Varela Round","Trebuchet MS","Segoe UI",Roboto,system-ui,sans-serif;
}
html{font-size:16px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;background:#14281c;font-family:var(--font);color:var(--ink);touch-action:none;overscroll-behavior:none}
canvas#game{position:fixed;left:0;top:0;display:block;touch-action:none;transform-origin:0 0;will-change:transform;
  image-rendering:crisp-edges;image-rendering:pixelated}
img{image-rendering:crisp-edges;image-rendering:pixelated}
.ico{width:1.6rem;height:1.6rem;vertical-align:middle;object-fit:contain;pointer-events:none;flex:none}
.ico.sm{width:1.2rem;height:1.2rem}.ico.lg{width:2.4rem;height:2.4rem}.ico.xl{width:3.4rem;height:3.4rem}.ico.xxl{width:4.6rem;height:4.6rem}
.hidden{display:none!important}

/* ---------- buttons: chunky, square-shouldered, like carved blocks */
.btn{font:inherit;font-weight:800;color:var(--ink);border:3px solid var(--ink);border-radius:.35rem;padding:.45rem .9rem;
  background:#f7e9c4;box-shadow:inset 0 -.28rem 0 #dcc592,inset 0 .16rem 0 #fffaf0,0 .22rem 0 var(--ink),0 .4rem .5rem var(--shadow);cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;gap:.35rem;font-size:.95rem;line-height:1.1;position:relative;top:0}
.btn:active{top:.18rem;box-shadow:inset 0 -.12rem 0 #dcc592,0 .04rem 0 var(--ink)}
.btn.green{background:#6fb84a;color:#fff;text-shadow:0 2px 0 #2a5a18;box-shadow:inset 0 -.28rem 0 #4a8c2e,inset 0 .16rem 0 #9ad870,0 .22rem 0 var(--ink),0 .4rem .5rem var(--shadow)}
.btn.red{background:#e0584a;color:#fff;text-shadow:0 2px 0 #6a1a10;box-shadow:inset 0 -.28rem 0 #b0382c,inset 0 .16rem 0 #f49080,0 .22rem 0 var(--ink),0 .4rem .5rem var(--shadow)}
.btn.gold{background:#f6cc4a;box-shadow:inset 0 -.28rem 0 #d49a22,inset 0 .16rem 0 #fff0a0,0 .22rem 0 var(--ink),0 .4rem .5rem var(--shadow)}
.btn.sm{padding:.3rem .55rem;font-size:.8rem}
.btn.on{background:#6fb84a;color:#fff;box-shadow:inset 0 -.28rem 0 #4a8c2e,inset 0 .16rem 0 #9ad870,0 .22rem 0 var(--ink)}
.btn[disabled],.btn.dis{filter:grayscale(.75) brightness(.95);opacity:.6;pointer-events:none}
.btn.wide{width:100%}

/* ---------- title */
#title{position:fixed;top:0;right:0;bottom:0;left:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:30;
  background:radial-gradient(ellipse at center,rgba(10,20,12,.15) 20%,rgba(8,16,10,.72) 100%)}
.logo{text-align:center;margin-bottom:1.4rem}
.logo h1{margin:0;font-size:clamp(2.6rem,8.5vw,5.4rem);font-weight:900;letter-spacing:.01em;color:#fff6dc;line-height:.95;
  -webkit-text-stroke:.13em var(--ink);paint-order:stroke fill;text-shadow:0 .09em 0 var(--ink),0 .2em .3em rgba(0,0,0,.45)}
.logo h1 span{color:#ffb84a}
.logo .sub{display:inline-block;margin-top:.8rem;background:var(--paper);border:3px solid var(--ink);border-radius:.3rem;padding:.25rem 1rem;font-weight:800;color:var(--ink2);box-shadow:0 .22rem 0 var(--ink)}
.logo .meeples{display:flex;justify-content:center;align-items:flex-end;gap:.5rem;margin-bottom:.5rem}
.logo .meeples img{width:3.4rem;height:auto;animation:hop 1.2s steps(4) infinite}
.logo .meeples img.t{width:4.6rem;animation:none}
.logo .meeples img:nth-child(3){animation-delay:.3s}.logo .meeples img:nth-child(4){animation-delay:.6s}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-.6rem)}}
.menu{display:flex;flex-direction:column;gap:.8rem;min-width:16rem}
.menu .btn{font-size:1.15rem;padding:.7rem 1.2rem}
.ver{position:fixed;bottom:.5rem;right:.8rem;color:#fff6dc;opacity:.7;font-size:.75rem;font-weight:700;z-index:31}

/* ---------- hud */
#hud{position:fixed;top:0;right:0;bottom:0;left:0;pointer-events:none;z-index:10}
.topbar{position:absolute;top:calc(.5rem + env(safe-area-inset-top));left:calc(.5rem + env(safe-area-inset-left));right:calc(.5rem + env(safe-area-inset-right));display:flex;gap:.5rem;align-items:flex-start;pointer-events:none}
.topbar > *{pointer-events:auto}
.pill{display:flex;align-items:center;gap:.35rem;background:var(--paper);border:3px solid var(--ink);border-radius:.35rem;padding:.2rem .65rem .2rem .3rem;
  font-weight:900;font-size:1.05rem;box-shadow:0 .22rem 0 var(--ink),0 .4rem .5rem var(--shadow);white-space:nowrap;min-height:2.6rem;font-variant-numeric:tabular-nums}
.pill .ico{width:1.8rem;height:1.8rem;object-position:bottom}
.pill.coins{min-width:6.5rem}
.pill.tap{cursor:pointer}
.topbar .brk{display:none}
.pill .lbl{font-size:.9rem}
.goal{flex:1;max-width:28rem;margin:0 auto;background:var(--paper);border:3px solid var(--ink);border-radius:.35rem;padding:.3rem .6rem .4rem;box-shadow:0 .22rem 0 var(--ink),0 .4rem .5rem var(--shadow)}
.goal .gt{display:flex;align-items:center;gap:.4rem;font-weight:900;font-size:.95rem}
.goal .gd{font-size:.76rem;font-weight:700;color:var(--ink2);line-height:1.2;margin:.05rem 0 .25rem}
.goal .gp{display:flex;align-items:center;gap:.4rem;font-size:.78rem;font-weight:900}
.bar{height:.6rem;background:#d8c49a;border:2px solid var(--ink);overflow:hidden;flex:1}
.bar > i{display:block;height:100%;width:0;background:#6fb84a;box-shadow:inset 0 -.2rem 0 #4a8c2e;transition:width .3s}
.iconbtn{width:3rem;height:2.9rem;padding:0}
.iconbtn .ico{width:1.9rem;height:1.9rem}
.toolbar{position:absolute;bottom:calc(.6rem + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:flex;gap:.45rem;padding:.45rem .5rem .55rem;pointer-events:auto;
  background:#8a5a32;border:3px solid var(--ink);border-radius:.4rem;box-shadow:inset 0 .2rem 0 #b07a42,inset 0 -.25rem 0 #6a4224,0 .25rem 0 var(--ink),0 .5rem 1rem var(--shadow)}
.tool{flex-direction:column;gap:.1rem;width:4.4rem;padding:.3rem .1rem .4rem;font-size:.74rem;font-weight:900}
.tool .ico{width:2.2rem;height:2.2rem}
.modebar{position:absolute;bottom:calc(6.6rem + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:.6rem;pointer-events:auto;
  background:var(--paper);border:3px solid var(--ink);border-radius:.35rem;padding:.45rem .5rem .55rem .8rem;font-weight:800;box-shadow:0 .22rem 0 var(--ink),0 .4rem .8rem var(--shadow);white-space:nowrap}
#fps{position:absolute;left:.5rem;bottom:.3rem;color:#fff;font:700 .75rem monospace;text-shadow:0 1px 2px #000;pointer-events:none}

/* ---------- panels */
#panel{position:fixed;top:calc(4.2rem + env(safe-area-inset-top));right:calc(.6rem + env(safe-area-inset-right));bottom:calc(6.8rem + env(safe-area-inset-bottom));width:min(26rem,94vw);z-index:20;
  display:flex;flex-direction:column;background:var(--paper);border:3px solid var(--ink);border-radius:.45rem;box-shadow:0 .3rem 0 var(--ink),0 .8rem 1.6rem var(--shadow);
  animation:slidein .16s steps(4)}
@keyframes slidein{from{transform:translateX(1.5rem);opacity:0}to{transform:none;opacity:1}}
.ph{display:flex;align-items:center;gap:.5rem;padding:.6rem .7rem .5rem;border-bottom:3px solid rgba(46,32,24,.18);background:var(--paper2);border-radius:.3rem .3rem 0 0}
.ph h2{margin:0;font-size:1.2rem;font-weight:900;flex:1;line-height:1.1}
.ph h2 small{display:block;font-size:.75rem;font-weight:700;color:var(--ink2)}
.ph .ico{width:2.6rem;height:2.6rem}
.close{width:2.5rem;height:2.4rem;padding:0;font-size:1.1rem}
.pb{flex:1;overflow-y:auto;padding:.6rem .7rem .9rem;touch-action:pan-y;-webkit-overflow-scrolling:touch}
.tabs{display:flex;gap:.3rem;padding:.5rem .7rem .1rem}
.tab{font-size:.85rem;padding:.35rem .7rem;flex:1}
.card{background:#fffaf0;border:3px solid var(--ink);border-radius:.35rem;padding:.5rem .55rem;margin-bottom:.55rem;box-shadow:0 .16rem 0 rgba(46,32,24,.65)}
.card.locked{opacity:.6;background:#efe4cc}
.row{display:flex;align-items:center;gap:.5rem}
.row.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.t{font-weight:900;font-size:.98rem}
.s{font-size:.78rem;color:var(--ink2);font-weight:700;line-height:1.25}
.chip{display:inline-flex;align-items:center;gap:.2rem;background:#f4e4bc;border:2px solid rgba(46,32,24,.55);border-radius:.25rem;padding:.05rem .4rem .05rem .15rem;font-size:.8rem;font-weight:900;margin:.15rem .15rem 0 0;font-variant-numeric:tabular-nums}
.chip .ico{width:1.3rem;height:1.3rem}
.chip.bad{background:#f8d0c8;border-color:#b03a2a;color:#8a2418}
.chip.ok{background:#d8f0c0;border-color:#3f7f25}
.sec{font-weight:900;font-size:.82rem;text-transform:uppercase;letter-spacing:.06em;color:var(--ink2);margin:.7rem 0 .35rem;display:flex;align-items:center;gap:.4rem}
.sec::after{content:"";flex:1;border-top:3px dotted rgba(106,74,50,.4)}
.bimg{width:4.6rem;height:4.6rem;object-fit:contain;flex:none}
.timg{width:3.2rem;height:4rem;object-fit:contain;object-position:bottom;flex:none}
.toggle{display:inline-flex;border:3px solid var(--ink);border-radius:.3rem;overflow:hidden}
.toggle button{font:inherit;font-weight:800;font-size:.8rem;border:0;padding:.3rem .6rem;background:#f4e4bc;color:var(--ink)}
.toggle button.on{background:var(--green);color:#fff}
.toggle button+button{border-left:3px solid var(--ink)}
input[type=range]{width:100%;accent-color:var(--green);height:1.6rem}
.setrow{display:flex;align-items:center;gap:.6rem;margin:.55rem 0;font-weight:800}
.setrow > span:first-child{width:7.5rem;flex:none}
.p{font-size:.9rem;line-height:1.45;font-weight:600}
.p b{font-weight:900}
.wk{display:flex;align-items:center;gap:.45rem;padding:.25rem 0;border-top:2px dotted rgba(106,74,50,.3)}
.wk .ico{width:2rem;height:2.6rem;object-position:bottom}
.wkb{display:flex;gap:.3rem;flex:none}
.qk{color:#2f6a1c}
.qk.off{color:#8a6a4a;text-decoration:line-through}
button.chip{font:inherit;font-size:.8rem;font-weight:900;color:var(--ink);cursor:pointer}
.bimg.tall{height:7.5rem;object-position:bottom}
.bigimg.anc{width:auto;height:min(15rem,36vh);image-rendering:pixelated}
.req{display:flex;align-items:center;gap:.5rem;margin:.35rem 0;font-size:.85rem;font-weight:800}
.req .ico{width:2rem;height:2rem}
.req .bar{margin:.1rem 0}
.toggle button.mid{min-width:3.2rem;background:#fffaf0;opacity:1}
.hatgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(5.2rem,1fr));gap:.45rem}
.hat{font:inherit;color:var(--ink);background:#fffaf0;border:3px solid var(--ink);border-radius:.35rem;padding:.3rem .2rem .35rem;text-align:center;font-size:.72rem;font-weight:800;line-height:1.1;box-shadow:0 .16rem 0 rgba(46,32,24,.65);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:.2rem}
.hat img{width:2.9rem;height:4.2rem;object-fit:contain;object-position:bottom;pointer-events:none}
.hat.on{background:#dff3c8;border-color:var(--green2);box-shadow:0 .16rem 0 var(--green2)}
.hat.lost{opacity:.5;cursor:default;background:#efe4cc}
.hat.lost img{filter:brightness(0) opacity(.35)}
.bigimg{width:min(14rem,60vw);height:auto;display:block;margin:0 auto .4rem}

/* ---------- toasts & modals */
#toasts{position:fixed;top:calc(4.6rem + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:40;display:flex;flex-direction:column;gap:.4rem;align-items:center;pointer-events:none;width:max-content;max-width:92vw}
.toast{background:var(--paper);border:3px solid var(--ink);border-radius:.35rem;padding:.35rem .8rem .35rem .45rem;font-weight:800;font-size:.92rem;display:flex;align-items:center;gap:.4rem;box-shadow:0 .22rem 0 var(--ink),0 .4rem .8rem var(--shadow);animation:toastin .2s steps(3)}
.toast.bad{background:#fbe0d8}
.toast.good{background:#e4f6cc}
@keyframes toastin{from{transform:translateY(-.8rem);opacity:0}to{transform:none;opacity:1}}
#modal{position:fixed;top:0;right:0;bottom:0;left:0;z-index:50;display:flex;align-items:center;justify-content:center;background:rgba(14,10,6,.6)}
.mbox{position:relative;background:var(--paper);border:4px solid var(--ink);border-radius:.5rem;padding:1.1rem 1.3rem 1.2rem;max-width:min(34rem,94vw);max-height:90vh;overflow:auto;box-shadow:inset 0 0 0 3px var(--paper2),0 .35rem 0 var(--ink),0 1rem 2rem rgba(0,0,0,.45);text-align:center;touch-action:pan-y}
.mbox h2{margin:.1rem 0 .6rem;font-size:1.55rem;font-weight:900}
.mbox .btns{display:flex;gap:.6rem;justify-content:center;margin-top:1rem;flex-wrap:wrap}
.slot{display:flex;align-items:center;gap:.7rem;text-align:left}
#mapcv{width:min(60vh,76vw);height:min(60vh,76vw);border:3px solid var(--ink);display:block;margin:0 auto;image-rendering:pixelated;touch-action:none;cursor:pointer}
.loading{flex-direction:column;text-align:center;padding:1.5rem;position:fixed;top:0;right:0;bottom:0;left:0;display:flex;align-items:center;justify-content:center;background:#1f3a26;color:#fff6dc;font-weight:900;font-size:1.4rem;z-index:100}

/* tablets: bigger touch targets */
@media (pointer:coarse){
  .btn.sm{min-height:2.5rem;padding:.35rem .7rem}
  .toggle button{min-height:2.4rem;padding:.35rem .75rem}
  .close{width:2.9rem;height:2.8rem}
  .pb{padding-bottom:1.4rem}
}
/* phones held upright: the goal drops to its own row under the counters */
@media (max-width:760px){
  html{font-size:14px}
  .topbar{flex-wrap:wrap;gap:.4rem}
  .pill{font-size:.95rem;min-height:2.5rem;padding:.15rem .5rem .15rem .25rem}
  .pill.coins{min-width:0}
  .pill .lbl{display:none}
  .wkb{flex-direction:column}
  #hLocate{margin-left:auto}
  .iconbtn{width:2.8rem;height:2.5rem}
  .topbar .brk{display:block;order:7;flex-basis:100%;height:0;margin-top:-.4rem}
  #hSeason{order:8;padding-right:.3rem}
  .goal{order:9;flex:1 1 0;min-width:0;max-width:none;margin:0}
  .goal .gd{display:none}
  #toasts{top:calc(7.6rem + env(safe-area-inset-top))}
  #panel{top:auto;left:calc(.4rem + env(safe-area-inset-left));right:calc(.4rem + env(safe-area-inset-right));width:auto;height:54vh;bottom:calc(6.4rem + env(safe-area-inset-bottom))}
  .tool{width:3.5rem}
  .modebar{white-space:normal;width:max-content;max-width:94vw;flex-wrap:wrap;justify-content:center}
}
/* phones held sideways: little height to spare */
@media (max-height:520px){
  html{font-size:13px}
  #title{flex-direction:row;gap:2.2rem}
  .logo{margin-bottom:0}
  .logo h1{font-size:clamp(2.2rem,7vw,3.6rem)}
  .menu{gap:.5rem;min-width:13rem}
  .menu .btn{font-size:1rem;padding:.5rem 1rem}
  .toolbar{padding:.3rem .4rem .4rem;gap:.35rem}
  .tool{width:3.9rem;padding:.2rem .1rem .3rem}
  .tool .ico{width:1.7rem;height:1.7rem}
  #panel{top:calc(3.9rem + env(safe-area-inset-top));bottom:calc(.5rem + env(safe-area-inset-bottom));right:calc(.5rem + env(safe-area-inset-right));width:min(24rem,52vw)}
  .toolbar{left:calc(.5rem + env(safe-area-inset-left));transform:none}
  .modebar{bottom:calc(4.6rem + env(safe-area-inset-bottom));left:calc(.5rem + env(safe-area-inset-left));transform:none}
}
.install{margin-top:.9rem;max-width:17rem;text-align:center;background:var(--paper);border:3px solid var(--ink);border-radius:.35rem;padding:.4rem .7rem;font-size:.82rem;font-weight:800;color:var(--ink2);box-shadow:0 .22rem 0 var(--ink)}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div class="loading" id="loading"><span>Sharpening axes…</span></div>

<div id="title" class="hidden">
  <div class="logo">
    <div class="meeples" id="logoMeeples"></div>
    <h1>Meeple<span>Jacks</span></h1>
    <div class="sub">a cozy little logging camp</div>
  </div>
  <div class="menu" id="mainMenu"></div>
</div>
<div class="ver" id="ver"></div>

<div id="hud" class="hidden">
  <div class="topbar">
    <div class="pill coins" id="hCoins"></div>
    <div class="pill" id="hCarry"></div>
    <div class="pill" id="hCrew"></div>
    <i class="brk"></i>
    <div class="pill tap" id="hSeason"></div>
    <div class="goal" id="hGoal"></div>
    <button class="btn iconbtn" id="hLocate"></button>
    <button class="btn iconbtn" id="hMenu"></button>
  </div>
  <div class="toolbar" id="toolbar"></div>
  <div class="modebar hidden" id="modebar"></div>
  <div id="fps" class="hidden"></div>
</div>

<div id="panel" class="hidden"></div>
<div id="toasts"></div>
<div id="modal" class="hidden"></div>

<script>
// Startup safety net, deliberately old-style JavaScript so it works on any WebView.
(function () {
  var shown = false;
  function chromeVer() { var m = /Chrome\/(\d+)/.exec(navigator.userAgent); return m ? +m[1] : 0; }
  function show(msg) {
    if (shown || window.__booted) return; shown = true;
    var el = document.getElementById('loading'); if (!el) return;
    var v = chromeVer();
    el.innerHTML = '<span>Timber! Something fell the wrong way.</span>' +
      '<div style="font-size:.9rem;font-weight:700;max-width:34rem;margin-top:1rem;line-height:1.4">' +
      (v && v < 70 ? 'Your tablet\'s <b>Android System WebView</b> is version ' + v + ', which is too old. Open the Play Store, search for <b>Android System WebView</b>, tap <b>Update</b>, then reopen the game.<br><br>' : '') +
      'Error details (send these to whoever is fixing it):</div>' +
      '<pre style="white-space:pre-wrap;font-size:.75rem;background:rgba(0,0,0,.3);padding:.8rem;border-radius:.6rem;max-width:90vw;text-align:left;user-select:text;-webkit-user-select:text">' +
      String(msg).replace(/</g, '&lt;') + '\n\nSteps: ' + (window.__stage || []).join(' > ') +
      '\nreadyState=' + document.readyState + ' visibility=' + document.visibilityState + ' size=' + innerWidth + 'x' + innerHeight +
      '\nWebView: Chrome ' + v + '\n' + navigator.userAgent.replace(/</g, '&lt;') + '</pre>';
  }
  window.__bootError = function (e) { show((e && (e.stack || e.message)) || e); };
  window.addEventListener('error', function (e) { show((e.message || 'Script error') + (e.filename ? '\n' + e.filename.split('/').pop() + ':' + e.lineno : '')); });
  window.addEventListener('error', function (e) { var t = e.target; if (t && t !== window && (t.src || t.href)) show('Could not load file: ' + (t.src || t.href)); }, true);
  window.addEventListener('unhandledrejection', function (e) { show(e.reason && (e.reason.stack || e.reason.message) || e.reason); });
  setTimeout(function () { if (!window.__booted) show('Still loading after 30 seconds (no error was reported).'); }, 30000);
  window.__stage = ['page start'];
})();
</script>
<script>/* js/data.js */
// MeepleJacks — game data: map size, trees, goods, tools, buildings, crew, goals. Tune the game here.
'use strict';

const VERSION = '1.2';
const TS = 16;                 // art pixels per tile
const MW = 192, MH = 192;      // map size in tiles
const CX = 96, CY = 96;        // the Lumber Yard sits here
const NTILES = MW * MH;

// Trees, from the middle of the map outward. Each ring is tougher to cut and worth more.
//   hp: axe damage needed · logs: logs dropped (1.5 means 2 and 1 by turns) · price: coins per log · regrow: seconds to grow back
const TREES = [
  { id: 'pine',    name: 'Pine',    hp: 4,  logs: 1.5, price: 2,   regrow: 120, col: '#2f7a45', bark: '#6a4428', wood: '#e2b87a' },

// tiny 3x5 font for numbers floating in the world
const FONT = {
  '0': '111101101101111', '1': '010110010010111', '2': '111001111100111', '3': '111001111001111', '4': '101101111001001',
  '5': '111100111001111', '6': '111100111101111', '7': '111001010010010', '8': '111101111101111', '9': '111101111001111',
  '+': '000010111010000', '-': '000000111000000', 'k': '100101110101101', '.': '000000000000010', '!': '010010010000010', 'x': '000101010101000',
};
function drawNum(ctx, str, x, y, col, out = '#1c120c') {
  x = Math.round(x - str.length * 2); y = Math.round(y);
  for (let pass = 0; pass < 2; pass++) {
    ctx.fillStyle = pass ? col : out;
    for (let i = 0; i < str.length; i++) {
      const g = FONT[str[i]]; if (!g) continue;
      for (let k = 0; k < 15; k++) if (g[k] === '1') {
        const px = x + i * 4 + (k % 3), py = y + ((k / 3) | 0);
        if (pass) ctx.fillRect(px, py, 1, 1); else ctx.fillRect(px - 1, py - 1, 3, 3);
      }
    }
  }
}

    case 1: o.bob = -Math.abs(Math.sin(t * 7)) * 6; o.legs = false; break;                                        // bunny hop
    case 2: o.flip = true; o.rot = 0.16; break;                                                                    // moonwalk
    case 3: o.rot = t * 8; o.legs = false; break;                                                                  // cartwheel
    case 4: o.bob = -Math.abs(Math.sin(t * 8)) * 3.5; o.rot = Math.sin(t * 8) * 0.18; break;                      // skip

R.draw = function (dt) {

// ---------------------------------------------------------------- placing or moving a building
function setGhost(tx, ty) {

  $('modebar').innerHTML = `<span>${R.ghost.ok ? (self ? 'Move it here?' : 'Build it here?') : 'Needs clear, dry ground. Tap another spot.'}</span>
    <button class="btn green ${R.ghost.ok ? '' : 'dis'}" data-a="ok">${self ? 'Move' : 'Build'}</button><button class="btn" data-a="cancel">Cancel</button>`;
}
function startPlace(type, moveId) {
  closePanel();

  const B = BUILD[type], self = moveId ? W.bById.get(moveId) : null;
  // start on the nearest free spot to the middle of the screen
  const w = R.screenToWorld(R.W / 2, R.H / 2), cx = Math.floor(w.x / TS) - (B.w >> 1), cy = Math.floor(w.y / TS) - 1;
  let best = null, bd = 1e9;
  for (let dy = -8; dy <= 8; dy++) for (let dx = -10; dx <= 10; dx++) {

  }
  setGhost(best ? best[0] : cx, best ? best[1] : cy);

const PTR = new Map();

<script>/* js/main.js */
// MeepleJacks — boot, main loop, game lifecycle.
'use strict';

const DEV = /[?&]dev=(\d+)/.exec(location.search);
const DEV_SPEED = DEV ? +DEV[1] : 1;
let lastFrame = 0, acc = 0, autosaveT = 0, running = true, fpsT = 0, fpsN = 0, titleT = 0;

function startGame(slot, fresh) {
  closeModal(); closePanel(); if (UI.place) endPlace();
  if (fresh || !loadGame(slot)) newGame(slot);
  SET.lastSlot = slot; saveSettings();
  UI.inGame = true; UI.paused = false;

  R.follow = true; R.cam.x = S.player.x; R.cam.y = S.player.y - 10; R.k = R.kT = R.defaultK(); R.anchor = null;
  $('title').classList.add('hidden'); $('ver').classList.add('hidden'); $('hud').classList.remove('hidden');
  buildHud();
  saveGame();
  if (fresh) modal(`<img class="ico xxl" src="${ART.url.player}"><h2>Welcome to the woods</h2>
    <p class="p">You have a rusty hatchet, a Lumber Yard and a forest that goes on for miles.<br><br><b>Tap a pine tree</b> to chop it down. Your Meeple carries the logs back to the yard, where you can sell them.</p>
    <div class="btns"><button class="btn green" data-a="ok">Let's chop</button></div>`, () => closeModal());
}
function toTitle() {
  UI.inGame = false; closePanel(); if (UI.place) endPlace();
  $('hud').classList.add('hidden'); $('title').classList.remove('hidden'); $('ver').classList.remove('hidden');
  demoWorld();
  buildTitleMenu();
}
// a busy little camp behind the title screen
function demoWorld() {
  newGame(-1);
  R.reset(); EV.length = 0;
  S.coins = 1e7; S.crewAxe = 2; S.inv[0] = 40; S.inv[1] = 12;
  for (const [type, x, y, crew] of [['cabin', CX - 9, CY + 2, ['jack', 'jack', 'hauler']], ['cabin', CX + 6, CY - 6, ['jack', 'hauler', 'hauler']], ['sawmill', CX + 5, CY + 3, ['sawyer']], ['forester', CX - 8, CY - 5, ['forester']]]) {
    const b = { id: S.nextId++, type, x, y, wood: -1 };
    S.buildings.push(b); rebuildBlocks();
    for (const role of crew) hire(b.id, role);
  }
  R.follow = false; R.cam.x = YARD_X; R.cam.y = YARD_Y + 6; R.k = R.kT = R.defaultK(); R.anchor = null;
}

function frame(now) {
  requestAnimationFrame(frame);
  if (!running) { lastFrame = now; return; }
  const cap = SET.fps ? 1000 / SET.fps : 0;

  const dt = Math.min(0.25, (now - lastFrame) / 1000);

    acc = Math.max(0, acc);
  }
  while (EV.length) { const e = EV.shift(); R.onEvent(e); if (UI.inGame) onGameEvent(e); }

    updateHud();
    autosaveT += dt;
    if (autosaveT > SET.autosave) { autosaveT = 0; saveGame(); }
  }

  fpsT += dt; fpsN++;
  if (fpsT > 0.5) { if (SET.showFps) $('fps').textContent = Math.round(fpsN / fpsT) + ' fps · ' + R.bw + '×' + R.bh; fpsT = 0; fpsN = 0; }
}

// lifecycle: pause everything when the app is hidden (no offline progress)
